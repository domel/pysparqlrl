name: quality
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/sparql_rl
      - run: pytest --junitxml=test-results.xml
      - run: pytest -m w3c
      - run: pytest --cov=sparql_rl --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-python-${{ matrix.python }}
          path: |
            test-results.xml
            coverage.xml
