name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rdflib: ["7.1.4", "7.6.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Select RDFLib version
        run: python -m pip install "rdflib==${{ matrix.rdflib }}"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/sparql_rl
      - name: Tests
        run: pytest
