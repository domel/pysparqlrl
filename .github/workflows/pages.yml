name: Deploy browser playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and test dependencies
        run: python -m pip install -e '.[dev]' build
      - name: Run tests
        run: pytest
      - name: Build wheel
        run: python -m build --wheel
      - name: Stage static site
        run: |
          mkdir -p _site/dist
          cp web/index.html web/style.css web/app.js web/worker.js web/examples.js web/favicon.ico _site/
          cp dist/sparql_rl-0.1.0-py3-none-any.whl _site/dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
